services:
  energytool:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-qwen/qwen3.8-27b}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-120}"
      RETRIEVER_MODE: "${RETRIEVER_MODE:-bm25}"
      SESSION_DIR: "/app/sessions"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
